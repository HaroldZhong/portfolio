<!doctype html>
<!--
  Source for public/images/social-card.jpg (1200x630). Regenerate from the repo root:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --virtual-time-budget=3000 --window-size=1200,630 \
    --screenshot=/tmp/social-card.png "file://$PWD/scripts/social-card.html"
  sips -z 630 1200 -s format jpeg -s formatOptions 85 /tmp/social-card.png --out public/images/social-card.jpg
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); }

  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0b0b0c;
    color: #edeae3;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Same light as the site's opening: violet, teal and amber glows under a dot grid. */
  .light { position: absolute; inset: 0;
    background:
      radial-gradient(520px 380px at 1040px -40px, rgba(110, 86, 207, .5), transparent 70%),
      radial-gradient(460px 360px at -60px 420px, rgba(27, 143, 134, .32), transparent 70%),
      radial-gradient(380px 260px at 760px 640px, rgba(192, 122, 58, .2), transparent 70%); }
  .dots { position: absolute; inset: 0; opacity: .16;
    background: radial-gradient(circle at 1px 1px, #edeae3 1px, transparent 0) 0 0 / 26px 26px;
    -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 100%); }

  .card { position: absolute; inset: 64px 72px 56px; display: grid; grid-template-columns: 1fr auto; column-gap: 56px; }
  .copy { display: flex; flex-direction: column; min-width: 0; }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0;
    font: 400 17px 'Geist Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: #a8a49b; }
  .eyebrow::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #b3a6ff; }
  h1 { margin: 26px 0 0; font: 400 142px/0.84 'Instrument Serif', serif; letter-spacing: -0.045em; }
  h1 em { display: block; padding-left: 0.62em; font-style: italic; letter-spacing: -0.03em; }
  .tagline { margin: auto 0 0; max-width: 26ch; text-wrap: balance; font-size: 25px; line-height: 1.3; letter-spacing: -0.01em; color: #edeae3; }
  .foot { display: flex; align-items: center; gap: 14px; margin-top: 26px; padding-top: 20px; border-top: 1px solid rgba(237, 234, 227, .14);
    font: 400 17px 'Geist Mono', monospace; letter-spacing: .02em; color: #a8a49b; }
  .mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #edeae3; color: #0b0b0c;
    font: italic 400 19px/1 'Instrument Serif', serif; }

  .portrait { align-self: center; width: 330px; padding: 9px; border: 1px solid rgba(237, 234, 227, .24); border-radius: 999px; }
  .portrait img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 999px; }
</style>
</head>
<body>
  <div class="light"></div>
  <div class="dots"></div>
  <main class="card">
    <div class="copy">
      <p class="eyebrow">Applied AI Engineer &amp; Researcher</p>
      <h1>Harold <em>Zhong</em></h1>
      <p class="tagline">I build AI systems and data workflows for reliable applications and rigorous research.</p>
      <div class="foot"><span class="mark">H</span>haroldzhong.github.io/portfolio</div>
    </div>
    <div class="portrait"><img src="../src/images/profile-headshot.jpg" alt=""></div>
  </main>
</body>
</html>
